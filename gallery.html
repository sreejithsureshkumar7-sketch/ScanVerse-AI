<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - ScanVerse AI</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header class="navbar">
    <div class="logo">ScanVerse <span>AI</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="scanner.html">Scanner</a>
      <a href="viewer.html">3D Viewer</a>
    </nav>
  </header>

  <main class="page">
    <h1>Scan Gallery</h1>
    <div class="gallery">
      <div class="model-card"><div class="thumb">📦</div><h3>Box Object</h3><p>GLB Ready</p></div>
      <div class="model-card"><div class="thumb">🪑</div><h3>Chair Object</h3><p>OBJ Ready</p></div>
      <div class="model-card"><div class="thumb">🚗</div><h3>Vehicle Object</h3><p>AR Ready</p></div>
    </div>
    <h2 style="margin-top:30px;">Recent Scans</h2>

<div id="history"></div>

<script>
const scans = JSON.parse(localStorage.getItem("scans") || "[]");
const history = document.getElementById("history");

history.innerHTML = scans.map(scan => 
<div class="model-card">
  <h3>${scan.name}</h3>
  <p>${scan.date}</p>
</div>
).join("");
</script>
  </main>
</body>
</html>
